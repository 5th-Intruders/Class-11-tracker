<head>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #000;
      line-height: 1.6;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
    }
    .charts {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 30px;
      margin-bottom: 40px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 40px;
    }
    .chart-container {
      background: #fafafa;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }
    .chart-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 15px;
      color: #333;
    }
    canvas {
      max-height: 280px;
    }
    @media (max-width: 768px) {
      .charts {
        grid-template-columns: 1fr;
      }
    }
    .subject-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 30px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 20px;
    }
    .subject-buttons button {
      padding: 6px 14px;
      border: 1px solid #e0e0e0;
      background: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .subject-buttons button:hover {
      border-color: #000;
    }
    .subject-buttons button.active {
      background: #000;
      color: #fff;
      border-color: #000;
    }
    h2 {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 20px;
    }
    .chapter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .chapter-name {
      font-size: 14px;
      flex: 1;
    }
    .status {
      display: flex;
      gap: 4px;
    }
    .status button {
      padding: 4px 10px;
      border: 1px solid #e0e0e0;
      background: #fff;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
    }
    .status button:hover {
      border-color: #000;
    }
    .status button.not-started {
      background: #f5f5f5;
      border-color: #d0d0d0;
    }
    .status button.in-progress {
      background: #000;
      color: #fff;
      border-color: #000;
    }
    .status button.completed {
      background: #000;
      color: #fff;
      border-color: #000;
      opacity: 0.7;
    }
    .subject-progress {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
    }
    .progress-bar {
      background: #f0f0f0;
      border-radius: 2px;
      overflow: hidden;
      height: 8px;
      margin-bottom: 8px;
    }
    .progress-fill {
      height: 8px;
      background: #000;
      transition: width 0.3s;
    }
    .progress-text {
      font-size: 13px;
      color: #666;
    }
    .install-prompt {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #000;
      color: #fff;
      padding: 12px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Class 11 Learning Tracker</h1>
    <p class="subtitle">Tracker thats been created by kartik</p>

    <div class="charts">
      <div class="chart-container">
        <div class="chart-title">Overall Progress</div>
        <canvas id="overallChart"></canvas>
      </div>
      <div class="chart-container">
        <div class="chart-title">Subject-wise Breakdown</div>
        <canvas id="subjectChart"></canvas>
      </div>
    </div>

    <div class="subject-buttons" id="subjectButtons"></div>

    <h2 id="subjectTitle"></h2>
    <div id="chapterList"></div>

    <div class="subject-progress">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="progress-text" id="progressText"></p>
    </div>
  </div>

  <div class="install-prompt" id="installPrompt">Install App</div>

  <script>
    const subjects = {
      "Physics": {
        chapters: [
          'Units and Measurements','Motion in a Straight Line','Motion in a Plane','Laws of Motion',
          'Work, Energy and Power','System of Particles and Rotational Motion','Gravitation',
          'Mechanical Properties of Solids','Mechanical Properties of Fluids','Thermal Properties of Matter',
          'Thermodynamics','Kinetic Theory','Oscillations','Waves'
        ],
        progress: {}
      },
      "Chemistry": {
        chapters: [
          'Some Basic Concepts of Chemistry','Structure of Atom','Classification of Elements',
          'Chemical Bonding','Redox Reactions','Chemical Thermodynamics','Equilibrium',
          'Organic Chemistry','Hydrocarbons'
        ],
        progress: {}
      },
      "Mathematics": {
        chapters: [
          'Sets','Relations & Functions','Trigonometric Functions','Complex Numbers','Linear Inequalities',
          'Permutations and Combinations','Binomial Theorem','Sequence and Series','Straight Lines',
          'Conic Sections','Three-dimensional Geometry','Limits and Derivatives','Statistics','Probability'
        ],
        progress: {}
      },
      "Computer Science": {
        chapters: [
          'Computer Systems','Python Basics','Data Types & Operators','Flow of Control','Strings','Lists',
          'Tuples','Dictionary','Python Modules','Society, Law and Ethics'
        ],
        progress: {}
      },
      "English Core": {
        chapters: [
          'The Portrait of a Lady','A Photograph','We\'re Not Afraid to Die','Discovering Tut',
          'The Laburnum Top','The Summer of the Beautiful White Horse','The Address','Mother\'s Day',
          'The Voice of the Rain','Childhood','The Adventure','Silk Road','Father to Son','Birth','The Tale of Melon City'
        ],
        progress: {}
      }
    };

    let selectedSubject = 'Physics';
    let overallChart, subjectChart;

    const loadProgress = () => {
      const saved = localStorage.getItem('class11-progress');
      if (saved) {
        const parsed = JSON.parse(saved);
        Object.keys(parsed).forEach(sub => {
          if (subjects[sub]) {
            subjects[sub].progress = parsed[sub].progress || {};
          }
        });
      }
    };

    const saveProgress = () => {
      localStorage.setItem('class11-progress', JSON.stringify(subjects));
    };

    const getStats = subject => {
      const s = subjects[subject];
      const total = s.chapters.length;
      const vals = Object.values(s.progress);
      const completed = vals.filter(v => v === 'completed').length;
      const inProgress = vals.filter(v => v === 'in-progress').length;
      const notStarted = total - completed - inProgress;
      return { total, completed, inProgress, notStarted, percent: Math.round((completed / total) * 100) };
    };

    function renderSubjects() {
      const div = document.getElementById('subjectButtons');
      div.innerHTML = '';
      for (const sub in subjects) {
        const stats = getStats(sub);
        const btn = document.createElement('button');
        btn.textContent = `${sub} ${stats.percent}%`;
        if (sub === selectedSubject) btn.classList.add('active');
        btn.onclick = () => { selectedSubject = sub; renderAll(); };
        div.appendChild(btn);
      }
    }

    function renderChapters() {
      const list = document.getElementById('chapterList');
      const s = subjects[selectedSubject];
      list.innerHTML = '';
      s.chapters.forEach((ch, i) => {
        const div = document.createElement('div');
        div.className = 'chapter';
        const status = s.progress[ch] || 'not-started';
        
        const nameSpan = document.createElement('span');
        nameSpan.className = 'chapter-name';
        nameSpan.textContent = `${i+1}. ${ch}`;
        
        const statusDiv = document.createElement('div');
        statusDiv.className = 'status';
        
        const btn1 = document.createElement('button');
        btn1.textContent = 'Not Started';
        if (status === 'not-started') btn1.classList.add('not-started');
        btn1.onclick = () => update(ch, 'not-started');
        
        const btn2 = document.createElement('button');
        btn2.textContent = 'In Progress';
        if (status === 'in-progress') btn2.classList.add('in-progress');
        btn2.onclick = () => update(ch, 'in-progress');
        
        const btn3 = document.createElement('button');
        btn3.textContent = 'Completed';
        if (status === 'completed') btn3.classList.add('completed');
        btn3.onclick = () => update(ch, 'completed');
        
        statusDiv.appendChild(btn1);
        statusDiv.appendChild(btn2);
        statusDiv.appendChild(btn3);
        
        div.appendChild(nameSpan);
        div.appendChild(statusDiv);
        list.appendChild(div);
      });
      
      document.getElementById('subjectTitle').textContent = selectedSubject;
      const st = getStats(selectedSubject);
      document.getElementById('progressFill').style.width = st.percent + '%';
      document.getElementById('progressText').textContent = `${st.completed} of ${st.total} chapters completed`;
    }

    window.update = (chapter, status) => {
      subjects[selectedSubject].progress[chapter] = status;
      saveProgress();
      renderAll();
    };

    function getOverallData() {
      let total = 0, completed = 0;
      Object.keys(subjects).forEach(s => {
        const t = getStats(s);
        total += t.total;
        completed += t.completed;
      });
      return { completed, remaining: total - completed };
    }

    function getAllSubjectsData() {
      return Object.keys(subjects).map(s => {
        const t = getStats(s);
        return { name: s, completed: t.completed, inProgress: t.inProgress, notStarted: t.notStarted };
      });
    }

    function renderCharts() {
      const overall = getOverallData();
      const ctx1 = document.getElementById('overallChart').getContext('2d');
      
      if (overallChart) overallChart.destroy();
      overallChart = new Chart(ctx1, {
        type: 'doughnut',
        data: {
          labels: ['Completed', 'Remaining'],
          datasets: [{
            data: [overall.completed, overall.remaining],
            backgroundColor: ['#000', '#e0e0e0'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: { display: true, position: 'bottom' }
          }
        }
      });

      const ctx2 = document.getElementById('subjectChart').getContext('2d');
      const data = getAllSubjectsData();
      
      if (subjectChart) subjectChart.destroy();
      subjectChart = new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: data.map(d => d.name),
          datasets: [
            { label: 'Completed', data: data.map(d => d.completed), backgroundColor: '#000' },
            { label: 'In Progress', data: data.map(d => d.inProgress), backgroundColor: '#666' },
            { label: 'Not Started', data: data.map(d => d.notStarted), backgroundColor: '#e0e0e0' }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: { legend: { display: true, position: 'bottom' } },
          scales: { 
            x: { stacked: true, grid: { display: false } }, 
            y: { stacked: true, grid: { color: '#f0f0f0' } } 
          }
        }
      });
    }

    function renderAll() {
      renderSubjects();
      renderChapters();
      renderCharts();
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installPrompt').style.display = 'block';
    });

    document.getElementById('installPrompt').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        document.getElementById('installPrompt').style.display = 'none';
      }
    });

    if ('srviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', (e) => {
          e.waitUntil(
            caches.open('class11-v1').then((cache) => {
              return cache.addAll(['/']);
            })
          );
        });
        self.addEventListener('fetch', (e) => {
          e.respondWith(
            caches.match(e.request).then((response) => {
              return response || fetch(e.request);
            })
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl);
    }

    loadProgress();
    renderAll();
  </script>
</body>
</html>
